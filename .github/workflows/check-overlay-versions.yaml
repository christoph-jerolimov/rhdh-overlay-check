name: Check overlay versions

on:
  workflow_dispatch:
  pull_request:
  schedule:
    # Once a day on workdays (Monday-Friday) at 06:00 UTC
    - cron: '0 6 * * 1-5'

env:
  BCP_DIR: .clones/bcp
  OVERLAY_DIR: .clones/overlay
  RHDH_PLUGINS_DIR: .clones/rhdh-plugins

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Clone backstage/community-plugins
        uses: actions/checkout@v4
        with:
          repository: backstage/community-plugins
          path: ${{ env.BCP_DIR }}

      - name: Clone redhat-developer/rhdh-plugin-export-overlays
        uses: actions/checkout@v4
        with:
          repository: redhat-developer/rhdh-plugin-export-overlays
          path: ${{ env.OVERLAY_DIR }}

      - name: Clone redhat-developer/rhdh-plugins
        uses: actions/checkout@v4
        with:
          repository: redhat-developer/rhdh-plugins
          path: ${{ env.RHDH_PLUGINS_DIR }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check overlay versions
        # Prints the result table to the log and writes it as a markdown
        # table to the GitHub workflow summary (GITHUB_STEP_SUMMARY) and
        # to overlay-version-check.md for the wiki update step below.
        run: yarn run check
        env:
          OUTPUT_FILE: overlay-version-check.md

      - name: Update wiki
        if: github.event_name != 'pull_request'
        env:
          WIKI_PAGE: Overlay-version-check.md
        run: |
          set -euo pipefail
          WIKI_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if git clone --depth 1 "$WIKI_URL" wiki 2>/dev/null; then
            :
          else
            mkdir wiki
            (
              cd wiki
              git init -b master
              git remote add origin "$WIKI_URL"
            )
          fi
          cp overlay-version-check.md "wiki/${WIKI_PAGE}"
          (
            cd wiki
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$WIKI_PAGE"
            if git diff --staged --quiet; then
              echo "Wiki page is already up to date."
            else
              git commit -m "Update overlay version check results"
              git push origin HEAD:master || git push origin HEAD:main
            fi
          )
